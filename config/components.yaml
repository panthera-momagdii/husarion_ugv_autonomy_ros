---
components:
  - type: LDR15
    parent_link: mount_link
    xyz: -0.19 0.0 0.15
    # GLIM integration: ouster forward-facing (X+ along robot's X+). Stock
    # was 0 0 3.14159 because the physical ouster's cable-exit defines its
    # X- as forward. In sim there's no cable, so we align it with base_link.
    # Together with the IMU rpy:=0 patch in panther_macro.urdf.xacro this
    # keeps imu_link, os_lidar, and base_link on a common heading, so
    # GLIM's identity T_lidar_imu (glim/config/config_sensors.json) is right.
    rpy: 0.0 0.0 0.0

  - type: CAM01
    parent_link: mount_link
    xyz: 0.2 0.0 0.05
    rpy: 0.0 0.0 0.0
    device_namespace: camera

  - type: WCH01
    parent_link: lights_channel_1_link
    xyz: -0.02 0.0 -0.0185
    rpy: 0.0 0.0 0.0